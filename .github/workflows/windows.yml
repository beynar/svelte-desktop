# On a Windows host, what a developer there runs (job host), and the Windows build of examples/notes
# (cross-compiled on Linux: Bun --compile + shell.dll with
# llvm-mingw in Docker + NSIS), then its e2e on a real Windows runner (WebView2, WinRT
# toasts, the COM toast activator, the shell's other services, web content control):
# examples/notes/tests/windows.test.ts.
name: windows

on:
  push:
    branches: [main, bun-webview-shell, ci-try]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install (the shell, examples/notes)
        run: |
          (cd packages/shell && bun install --frozen-lockfile)
          (cd examples/notes && bun install --frozen-lockfile)
          (cd examples/kit-conformance && bun install --frozen-lockfile)
      - name: Build the Windows app (shell.dll, addon and installer through the Docker toolchain)
        working-directory: examples/notes
        run: KITOP_TARGET=windows bunx --bun vite build
      - name: A closed bridge list, then the build to distribute (--release, no list)
        working-directory: examples/kit-conformance
        run: |
          KITOP_TARGET=windows bunx --bun vite build
          mv ".desktop/dist/Kit Conformance-windows-x64" "$RUNNER_TEMP/kit-listed"
          KIT_NO_LIST=1 bunx kitop build --windows --release
          mv ".desktop/dist/Kit Conformance-windows-x64" "$RUNNER_TEMP/kit-release"
      - name: Unit tests (packagers)
        working-directory: packages/shell
        env:
          KITOP_SIGN_TEST: native/build/windows-x64/shell.dll
        run: bun test src/build/package-windows.test.ts src/build/package-linux.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: kit-listed
          path: ${{ runner.temp }}/kit-listed
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kit-release
          path: ${{ runner.temp }}/kit-release
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notes-windows-x64
          path: examples/notes/.desktop/dist/Svelte Notes-windows-x64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: notes-windows-x64-installer
          path: examples/notes/.desktop/dist/*-setup.exe
          if-no-files-found: error

  host:
    # On a Windows machine, what a developer there runs: the unit tests, the website's dev and build,
    # and the app's with the shell.dll the job above cross-compiled.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: notes-windows-x64
          path: notes-app
      - name: Install
        working-directory: packages/shell
        run: bun install --frozen-lockfile
      - name: Unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/shell
        run: bun test src
      - name: On a Windows host
        if: ${{ !cancelled() }}
        working-directory: packages/shell
        env:
          WINDOWS_SHELL_DLL: ${{ github.workspace }}\notes-app\shell.dll
        run: bun test --timeout 300000 test/windows-host

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: notes-windows-x64
          path: notes-app
      - uses: actions/download-artifact@v4
        with:
          name: notes-windows-x64-installer
          path: notes-installer
      - uses: actions/download-artifact@v4
        with:
          name: kit-listed
          path: kit-listed
      - uses: actions/download-artifact@v4
        with:
          name: kit-release
          path: kit-release
      - name: Install (examples/notes, no scripts)
        working-directory: examples/notes
        run: bun install --ignore-scripts
      - name: Install (examples/kit-conformance, no scripts)
        working-directory: examples/kit-conformance
        run: bun install --ignore-scripts
      - name: A closed bridge list
        working-directory: examples/kit-conformance
        env:
          KIT_APP: ${{ github.workspace }}\kit-listed
        run: bun test --timeout 120000 tests/bridge.test.ts
      - name: The build to distribute (--release, no list)
        working-directory: examples/kit-conformance
        env:
          KIT_APP: ${{ github.workspace }}\kit-release
        run: bun test --timeout 120000 tests/release.test.ts
      - name: Session info
        shell: powershell
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          "user: $($id.Name)  admin: $(([Security.Principal.WindowsPrincipal]$id).IsInRole('Administrators'))  session: $((Get-Process -Id $PID).SessionId)"
          [System.Environment]::OSVersion.VersionString
          Get-ChildItem notes-app | Format-Table Name, Length
      - name: e2e (tests/windows.test.ts)
        working-directory: examples/notes
        env:
          WINDOWS_E2E: '1'
          WINDOWS_APP: ${{ github.workspace }}\notes-app
          WINDOWS_SHOTS: ${{ runner.temp }}\shots
          WINDOWS_INSTALLER: ${{ github.workspace }}\notes-installer
        run: |
          New-Item -ItemType Directory -Force $env:WINDOWS_SHOTS | Out-Null
          bun test --timeout 300000 tests/windows.test.ts tests/windows-web.test.ts tests/windows-sessions.test.ts tests/windows-desktop.test.ts tests/windows-window.test.ts
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}\shots
          if-no-files-found: warn
      - name: App logs on failure
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\dev.kitop.notes" -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\dev.kitop.notes" -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
