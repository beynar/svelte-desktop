[package]
name = "kitop"
version = "0.1.0"
edition = "2021"
description = "Native plugins in Rust for kitop apps: commands callable from pages and server code, typed."
license = "MIT"

[lib]
name = "kitop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
