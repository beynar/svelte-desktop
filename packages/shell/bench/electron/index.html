<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hello</title>
<style>body{font-family:-apple-system,sans-serif;text-align:center;margin-top:120px}button{font-size:18px;padding:8px 20px}</style>
</head>
<body>
<h1>Hello, world</h1>
<button id="b">count: 0</button>
<script>
let n = 0;
const b = document.getElementById('b');
b.addEventListener('click', () => { b.textContent = 'count: ' + (++n); });
// Benchmark beacon: tells the harness the page has loaded.
window.addEventListener('load', () => {
  fetch('http://127.0.0.1:47321/ready', { mode: 'no-cors', cache: 'no-store' }).catch(() => {});
});
</script>
</body>
</html>
