    status: {impl: implemented, test: untested, platform: darwin}

  autostart:
    methods:
      - {name: enable/disable/isEnabled, sig: "app.setLoginItem(enabled) — SMAppService (macOS 13+); unbundled → unavailable", upstream: "quickgui AutoStart", impl: implemented, test: tested, platform: darwin, notes: "cleanup on test teardown required"}
