# spec/native-api.yaml — V1 native API inventory (authoritative)
# Status values:
#   impl:    specified | bound | implemented | tested
#   platform: darwin | linux | windows | none
#   test:    tested | specified | untested | not_run | unsupported
# Convention: unsupported ops MUST return {error:{code:"unsupported",reason}}
# — never silently succeed. Async by default; dispose/unsubscribe explicit;
# no raw pointers in the public API; no synchronous cross-process UI calls.
version: 0.1.0
meta:
  backends:
    gpuix: "@gpuix/native 0.7.0 (NAPI in-process)"
    gpuix_platform: "native/src/platform.rs brokered dispatcher via renderer.platformCall — see documentation/platform-api.mdx"
    quickgui: "@quickgui/native 0.1.4-next.1 (bun:ffi dylib)"
    bun: "Bun 1.4.0 process APIs"
    native_core: "crates/native-core cdylib via generated bindings"
  authority_note: >
    Signatures below are the proposed $native contract. `upstream` records the
    reference each entry was audited against (quickgui binding names are real
    exports inspected in node_modules; electron/tauri names are API-surface
    references only). Since 2026-09-16 the gpuix_platform backend is live:
    one napi method, JSON envelopes, pending→platformResult async, typed
    services in gpuix-poc/src/native-api/.
  platform_evidence: "results/run-2026-09-18-platform/platform.jsonl (124/127 ok, 0 fails, 3 modal skips — dialogs, authenticate prompt, menu.popup)"
  reactive_stores: >
    Public surface `svelte-desktop/stores` (src/native-api/stores.svelte.ts →
    gen/native-api/stores.js; tsconfig paths + #stores alias). Normalized:
    each domain is ONE object carrying $state fields for every nullary
    value-getter PLUS its action methods — app, window, windowState, screen,
    clipboard, theme, system, power, deepLink, menu, notifications, capture,
    diagnostics, capabilities, update, tray, shortcuts — initStores() inits
    all (failures captured on ns.error). Event-fed where the OS provides one
    (appearanceChanged, keyboardLayoutChanged, thermalStateChanged,
    systemWake, openUrls, menuAction, notificationResponse, willQuit,
    willRestart, reopened, boundsChanged, willClose, displaysChanged,
    systemSleep, screenLocked, screenUnlocked, trayClick, shortcutPressed,
    shortcutReleased). Exceptions by design: secureStorage (no secrets
    in reactive memory), shell/dialog (pure actions re-exported verbatim),
    parameterized queries stay methods.

surfaces:

  app:
    methods:
      - {name: getInfo, sig: "getInfo(): {name, version, bundleId}", upstream: "electron app.getName/getVersion", impl: implemented, test: tested, platform: darwin+linux+windows, evidence: "platform.jsonl app.getInfo"}
      - {name: getPath, sig: "getPath(name): string — home|appPath|exe|temp|appData|userData|logs|caches|documents|downloads|desktop|music|pictures|videos", upstream: "electron app.getPath", impl: implemented, test: tested, notes: "bogus name → invalid_args verified"}
      - {name: whenReady, sig: "whenReady(): Promise<void>", upstream: "electron app.whenReady", impl: implemented, test: tested, notes: "GpuixRenderer.init + first tick — measured ~440ms dev"}
      - {name: activate, sig: "activate(steal?: boolean): void — app.show", upstream: "quickgui activateNativeApplication", impl: implemented, test: untested, platform: darwin}
      - {name: hide/unhide, sig: "hide()/show()/hideOthers()/showAll()", upstream: "quickgui hideNativeApplication", impl: implemented, test: untested, platform: darwin}
      - {name: quit, sig: "quit(): void; exit(code): void", upstream: "quickgui requestNativeQuit/exitNativeAppWithCode", impl: implemented, test: untested, notes: "exit() = immediate process exit; quit() via gpui"}
      - {name: relaunch, sig: "relaunch(): void", upstream: "electron app.relaunch", impl: implemented, test: untested}
      - {name: setActivationPolicy, sig: "setActivationPolicy('regular'|'accessory'|'prohibited') → true", upstream: "quickgui setNativeActivationPolicy", impl: implemented, test: untested, platform: darwin}
      - {name: setDockBadge/bounceDock, sig: "setDockBadge(text|null) → true; bounceDock('critical'|'informational') → true — NSDockTile + requestUserAttention", impl: implemented, test: untested, platform: darwin}
      - {name: setLoginItem, sig: "setLoginItem(enabled) → {enabled} — SMAppService (macOS 13+); unbundled dev → unavailable", impl: implemented, test: untested, platform: darwin}
      - {name: requestSingleInstanceLock, sig: "→ {acquired} via NSRunningApplication bundle-id count; dev (no bundleId) → {acquired:true}", impl: implemented, test: untested, platform: darwin, notes: "secondInstance event EMITTED via NSDistributedNotificationCenter 'svelte-desktop-second-instance' {argv,cwd} (events_ext.rs); secondary posts before exiting"}
      - {name: setDockProgress, sig: "setDockProgress({status:'none'|'normal'|'paused'|'error'|'indeterminate', completed?, total?}) — dock-tile NSProgressIndicator overlay", impl: implemented, test: tested, platform: darwin, evidence: "platform.jsonl normal→paused→none"}
      - {name: getBundleType, sig: "→ {type:'app'|'binary'|...} from bundlePath suffix", impl: implemented, test: tested, platform: darwin}
      - {name: defaultWindowIcon, sig: "→ {pngBase64}|null — app icon TIFF→PNG", impl: implemented, test: tested, platform: darwin}
      - {name: aboutPanel, sig: "aboutPanel({name?,version?,copyright?,credits?}) — orderFrontStandardAboutPanelWithOptions", impl: implemented, test: tested, platform: darwin, notes: "non-modal; role 'about' in menus maps to the same panel"}
      - {name: appActivated/appDeactivated, sig: "events {} — NSApplication did-become/resign-active, dual-center deduped", impl: implemented, test: tested, platform: darwin, evidence: "platform.jsonl event stream"}
      - {name: isPackaged, sig: "getInfo().packaged", upstream: "quickgui nativeApplicationPackaged", impl: implemented, test: tested}
      - {name: setName/setIdentity/addRecentDocument, impl: implemented, test: tested, evidence: "platform.jsonl"}
      - {name: onOpenFile/onOpenUrl, sig: "openUrls/reopened/willQuit/willRestart events", upstream: "electron open-file/open-url, quickgui DeepLink", impl: implemented, test: untested, notes: "registered at init both paths; unbundled scheme registration refused"}

  window:
    methods:
      - {name: create, sig: "create(opts: WindowOptions): Promise<WindowHandle>", upstream: "quickgui create_window FFI sym / electron BaseWindow", impl: bound, test: tested, notes: "gpuix single-window; quickgui multi-window VERIFIED (2 wins, independent Svelte trees)"}
      - {name: multi-window, sig: "N windows, independent renderers, close-one-keep-others", impl: implemented, test: tested, platform: darwin, evidence: "results/run-20260915-b/multiwin.log", notes: "BLOCKER: Bun host segfaults on worker exit while host holds FFI callbacks (null deref @0x8); app.destroy() from a timer races dispatch pump"}
      - {name: list/current, sig: "getAll(): WindowHandle[]; getCurrent(): WindowHandle", impl: specified, test: untested}
      - {name: show/hide/close/destroy, sig: "per handle", upstream: "quickgui performNativeWindowAction", impl: bound, test: untested}
      - {name: focus, impl: bound, test: tested, notes: "focusElement + FocusHandle verified in overlay work"}
      - {name: setTitle/setIcon, impl: implemented, test: tested, upstream: "performNativeWindowImageAction", evidence: "platform.jsonl setTitle→getTitle"}
      - {name: bounds, sig: "getBounds(): {x,y,w,h}+state; setSize(w,h); getPosition()/setPosition(x,y)", impl: implemented, test: tested, notes: "setPosition via patched gpui PlatformWindow::set_position (setFrameTopLeftPoint, y-flipped); boundsChanged event streams OS moves/resizes"}
      - {name: minMaxSize, sig: "setMinSize(w,h)/setMaxSize(w,h) — {0,0} clears; NSWindow setMinSize:/setMaxSize:", impl: implemented, test: tested, platform: darwin}
      - {name: minimize/maximize/restore/fullscreen, impl: implemented, test: tested, upstream: "gpui zoom/toggle_fullscreen", evidence: "platform.jsonl fullscreen roundtrip on:true off:false"}
      - {name: frame/position, sig: "center(); hide(); show(); setBounds(x,y,w,h); innerSize/innerPosition/outerSize/outerPosition(); positionTo(preset) — center|trayCenter|trayLeft|trayRight|trayTop|trayBottom|cursorTopLeft|cursorBottomLeft; restore(); unminimize(); isMinimized()→{minimized}", impl: implemented, test: tested, platform: darwin, evidence: "platform.jsonl setBounds/center/positionTo roundtrips"}
      - {name: stacking/state, sig: "setAlwaysOnTop(bool); setAlwaysOnBottom(bool); blur(); isHovered()→{hovered}; isActive(); isOccluded()→bool — fully covered/minimized/off-space, no pixel on screen; setSimpleFullscreen(bool)/isSimpleFullscreen; setVisibleOnAllWorkspaces(bool)", impl: implemented, test: tested, platform: darwin}
      - {name: chrome, sig: "setResizable/isResizable; setClosable/isClosable; setMinimizable/isMinimizable; setMaximizable/isMaximizable (zoom-button enable — unavailable if absent); setTitleBarStyle('default'|'transparent'|'hidden'|'hiddenInset'); setDecorations(bool); setHasShadow(bool)+invalidateShadow(); setDocumentEdited/setEdited(bool)/isDocumentEdited", impl: implemented, test: tested, platform: darwin}
      - {name: controlsArea, sig: "getControlsArea() → {x,y,width,height,contentTop,side,buttons:{close?,minimize?,zoom?}} | null — traffic-light cluster in window-frame coords (top-left of the window, y down); contentTop = drawable inset from frame top (content-space y = y - contentTop); per-button rects carry {visible}; null on borderless windows; window.controlsArea $state mirrors it via refresh()", impl: implemented, test: tested, platform: darwin}
      - {name: appearance/effects, sig: "setOpacity(0..1)/getOpacity; setContentProtected(bool)/isContentProtected — NSWindow sharingType (anti-screenshot); setTheme('system'|'light'|'dark') — NSAppearance; setMovable/setMovableByWindowBackground; setIgnoresMouseEvents/ignoresMouseEvents", impl: implemented, test: tested, platform: darwin}
      - {name: cursor, sig: "setCursorHidden(bool); setCursorPosition(x,y) — CGDisplay warp, screen coords", impl: implemented, test: tested, platform: darwin}
      - {name: setFocusable, impl: unsupported, test: tested, platform: darwin, notes: "no public per-window canBecomeKeyWindow setter — fixed at creation"}
      - {name: decorations/transparent/alwaysOnTop, impl: implemented, test: tested, notes: "superseded by chrome/stacking rows above"}
      - {name: isFocused/scaleFactor/cursorPoint/requestAttention/setRepresentedFilename, impl: implemented, test: tested, evidence: "platform.jsonl"}
      - {name: multi-window ops, sig: "create({label?,title?,x?,y?,width?,height?,minWidth?,minHeight?,decorations?,visible?|show?,alwaysOnTop?,resizable?,movable?,minimizable?,focus?,transparent?,titlebarTransparent?,tabbingIdentifier?}) → {windowId,label}; list() → [{windowId,label,title,focused,bounds,state}]; focus(windowId?); get(label) → info|null; close(windowId?); all existing window ops take optional trailing windowId", impl: implemented, test: tested, platform: darwin, notes: "M3: windowId u32 non-negative int (fractional → invalid_args), primary=0, ids monotonic never reused; labels unique → invalid_args on dup; unknown id → unavailable; get miss → null; create fires 'created' event; decorations:false→titlebar:None; alwaysOnTop→WindowKind::Floating; Outcome::Now (open_window is sync)"}
      - {name: windowId passthrough, sig: "every window op accepts optional windowId — resolution order: explicit arg → dispatching view's window → 0", impl: implemented, test: tested, notes: "additive args field; absent preserves single-window behavior"}
      - {name: window-scoped events, sig: "focusChanged/boundsChanged/scaleFactorChanged/willClose/closed/created payloads gain {windowId}; element events carry the emitting view's windowId; JS emitTo(windowId,event,payload)/onWindow(windowId,event,cb) scope the local bus (data.windowId filter)", impl: implemented, test: tested, notes: "closed → JS destroys the subtree via normal destroyElement ops; setRoot op gains optional trailing windowId ['setRoot',id,w]"}
      - {name: focusChanged/scaleFactorChanged, sig: "events {focused}/{scaleFactor} — NSWindow key-status + backing-properties notifications (events_ext.rs)", impl: implemented, test: tested, platform: darwin}
      - {name: onWillClose (+onCloseRequested alias), sig: "setCloseVeto(bool) + willClose event; disarm→close() to confirm", impl: implemented, test: untested, upstream: "quitInterception / gpui on_window_should_close", notes: "veto is pre-armed (sync callback can't await JS); programmatic close() bypasses"}
      - {name: events, sig: "resize|move|focus|blur|dpi-change|theme-change", impl: implemented, test: tested, notes: "appearanceChanged + boundsChanged delivered via platform event bus"}
    status: {impl: implemented, test: partial, platform: darwin}

  windowState:
    methods:
      - {name: save/restore, sig: "save(): State; load(): State|null; restore(): State|null — JSON in app.getPath('userData')", impl: implemented, test: tested, upstream: "quickgui WindowState/WindowRestoreState", evidence: "platform.jsonl windowState roundtrip", notes: "pure-JS service (native-api/windowState.ts); size+position restore (native setPosition landed)"}
      - {name: reactive store, sig: "windowState (svelte-desktop/stores): persisted/saving/ready as $state", impl: implemented, test: tested, evidence: "native-api.test.ts + platform.jsonl store probes", notes: "live window values moved to the `window` namespace; persisted JSON is the $state"}
    status: {impl: implemented, test: tested, platform: darwin}

  screen:
    methods:
      - {name: getDisplays, sig: "getAllDisplays(): DisplayInfo[]", upstream: "quickgui Screen", impl: implemented, test: tested, evidence: "platform.jsonl dual-display uuid/bounds/workArea"}
      - {name: primary/nearest/matching, impl: implemented, test: tested}
      - {name: getCursorPosition, sig: "getCursorScreenPoint(): {x,y} global", impl: implemented, test: tested, platform: darwin}
      - {name: onChanged, sig: "hot-plug/config event", impl: specified, test: untested}
    status: {impl: implemented, test: tested, platform: darwin, notes: "fields: id, uuid, bounds, workArea, isPrimary; scaleFactor via screen.scaleFactor"}

  dialog:
    methods:
      - {name: open, sig: "showOpenDialog({files?,directories?,multiple?,prompt?,filters?}): Promise<{canceled,paths[]}>", upstream: "gpui prompt_for_paths", impl: implemented, test: specified, notes: "pending→platformResult; modal UI blocks automation; filters WIRED — gpui PathPromptOptions.filters [{name,extensions}] landed in the fork (union → setAllowedFileTypes, macOS)"}
      - {name: save, sig: "showSaveDialog({defaultPath?,suggestedName?,filters?}): Promise<{canceled,path|null}>", impl: implemented, test: specified, notes: "filters wired via prompt_for_new_path filters param (fork)"}
      - {name: message/confirm/error, sig: "showMessageBox({type,title,message,detail,buttons,cancelId}): Promise<{response,canceled}>", impl: implemented, test: specified}
    status: {impl: implemented, test: specified, platform: darwin, notes: "cancel → {canceled:true}, typed not throw"}

  menu:
    methods:
      - {name: setApplicationMenu, sig: "menu.setAppMenu(MenuSpec[]) — dynamic ids via PlatformMenuAction", upstream: "gpui set_menus", impl: implemented, test: tested, evidence: "platform.jsonl menu.setAppMenu"}
      - {name: setDockMenu, sig: "menu.setDockMenu(MenuItemSpec[])", impl: implemented, test: tested, platform: darwin}
      - {name: setWindowMenu/releaseWindowMenu, impl: specified, test: untested}
      - {name: popupContext, sig: "menu.popup({items, x?, y?}) → {dismissed} — NSMenu at screen coords (or cursor)", impl: implemented, test: untested, platform: darwin, notes: "items emit menuAction {id}; item extras (role/icon/accelerator/checked) via apply_item_extras on both leaf and submenu entries"}
      - {name: items, sig: "action|separator|submenu; checked/disabled; menuAction event carries id", impl: implemented, test: tested, notes: "roles + accelerators + native icons landed (see update/roles rows)"}
      - {name: update/get/items, sig: "menu.update({id,text?,enabled?,checked?,accelerator?}) → null; menu.get(id) → item|null; menu.items() → tree — walks NSApp.mainMenu + dock menu; missing id → unavailable", impl: implemented, test: tested, platform: darwin, evidence: "platform.jsonl update→get→restore"}
      - {name: insert/remove, sig: "menu.insert({name, icon?, items?, id?, index?}) → {inserted:true, name} — one top-level bar entry; items→submenu (menuAction per id), absent→clickable bar item firing menuAction; re-inserting a name replaces; index absent→before Window. menu.remove(name) → {removed:true, name}. representedObject marks foreign entries so top_pairs stays aligned", impl: implemented, test: untested, platform: darwin}
      - {name: roles, sig: "item {role} — edit roles (copy/cut/paste/selectAll/undo/redo/pasteAndMatchStyle/delete) → responder-chain selectors; app roles (quit/hide/hideOthers/showAll/about) → NSApp targets; window roles (minimize/zoom/close/fullscreen/speaking) → window selectors; services → setServicesMenu; setAppMenu path maps via gpui OsAction + app_menu action types", impl: implemented, test: tested, platform: darwin}
      - {name: icons, sig: "item {icon:{native:name}} → NSImage imageNamed (NATIVE_ICON_NAMES — 58-name NSImageName* whitelist, Tauri vocabulary + extras, case-insensitive); {icon:{path}} → file; null clears — NSMenuItem builders only (gpui MenuItem has no image field)", impl: implemented, test: tested, platform: darwin}
      - {name: accelerators, sig: "item {accelerator:'CmdOrCtrl+Shift+K'} — full modifier+key grammar incl F1-F35/numpad/arrows; update can mutate live", impl: implemented, test: tested, platform: darwin}
      - {name: trayClickRect, sig: "trayClick event carries {x,y,width,height} button rect (top-left screen coords); tray.lastRect mirror; window.positionTo('tray*') presets consume it", impl: implemented, test: untested, platform: darwin}
    status: {impl: implemented, test: tested, platform: darwin}

  tray:
    methods:
      - {name: set, sig: "tray.set({title?, tooltip?, imagePath?, imageName?, icon?, badgeColor?, menu?}) — NSStatusItem; icon sources: imagePath/image/icon:\"/path\"/icon:{path} → file, imageName/icon:{native} → NSImageName* vocabulary; badgeColor composites a dot onto the icon top-right (non-template image so it keeps its color; null restores); menu items emit menuAction {id}; menu:null wires trayClick, menu:{items} swallows it", upstream: "quickgui Tray/TrayIcon class", impl: implemented, test: tested, platform: darwin}
      - {name: remove/isSet, sig: "tray.remove() → {removed:true} (no-item → unavailable); tray.isSet() → bool", impl: implemented, test: untested}
      - {name: events, sig: "trayClick (only when no menu attached — AppKit swallows clicks otherwise)", impl: implemented, test: untested}
    status: {impl: implemented, test: untested, platform: darwin, notes: "NSStatusItem via platform/tray.rs; linux DE-dependent → unsupported there"}

  clipboard:
    methods:
      - {name: readText/writeText, sig: "string; writeText(text), readText(): string|null", upstream: "gpui write_to_clipboard/read_from_clipboard", impl: implemented, test: tested, evidence: "platform.jsonl roundtrip"}
      - {name: readHTML/writeHTML, sig: "readHtml(): string|null; writeHtml(html); readRtf/writeRtf — NSPasteboard public.html/public.rtf", impl: implemented, test: untested, platform: darwin}
      - {name: readImage/writeImage, sig: "PNG base64 {bytes,format}", impl: implemented, test: untested}
      - {name: readPaths, sig: "readPaths(): string[]|null", impl: implemented, test: untested}
      - {name: readBookmark, impl: bound, test: untested, platform: darwin, notes: "macOS security-scoped bookmarks"}
      - {name: formats/has/clear, impl: implemented, test: tested, evidence: "platform.jsonl availableFormats + has + clear→null"}
      - {name: onChanged, impl: specified, test: untested, notes: "poll-based; document wakeup cost; optional"}
    status: {impl: implemented, test: tested, platform: darwin}

  shortcuts:
    methods:
      - {name: register/unregister/unregisterAll/isRegistered, sig: "register({accelerator:'CmdOrCtrl+Shift+K', id?}) → {id}; unregister({id}) → {unregistered:true} (unknown id → invalid_args); unregisterAll() → {unregistered:count}; isRegistered(id) → bool; shortcutPressed/shortcutReleased events {id}", upstream: "quickgui GlobalShortcut / Carbon RegisterEventHotKey", impl: implemented, test: untested, platform: darwin}
      - {name: appLocal, sig: "handled in-app via keydown + menu accelerators", impl: implemented, test: tested, notes: "menu accelerators route natively"}
    status: {impl: implemented, test: untested, platform: darwin, notes: "Carbon hotkeys — no accessibility perm needed for own-app chords; colliding registrations → denied"}

  notifications:
    methods:
      - {name: getPermissionStatus/requestPermission, sig: "aliases → system.checkPermission/requestPermission('notifications') — UNUserNotificationCenter pending lane; unbundled → unavailable", impl: implemented, test: tested, platform: darwin}
      - {name: show, sig: "show({title,body?,tag?,actions?}): {tag}", upstream: "gpui show_system_notification", impl: implemented, test: tested, evidence: "platform.jsonl notifications.show"}
      - {name: dismiss, sig: "dismiss(tag)", impl: implemented, test: tested}
      - {name: onResponse, sig: "notificationResponse event {tag, actionId|null}", impl: implemented, test: untested, notes: "observer registered; needs interactive click to verify"}
      - {name: cancel/replace, impl: implemented, test: untested}
    status: {impl: implemented, test: tested, platform: darwin, notes: "needs bundle id + signing for OS delivery; unsigned dev → delivered silently or denied by OS"}

  shell:
    methods:
      - {name: openExternal, sig: "openExternal(url) — allowlist http(s)/mailto/tel/sms/facetime/maps", upstream: "gpui open_url", impl: implemented, test: tested, evidence: "platform.jsonl javascript:→denied, notaurl→invalid_args"}
      - {name: openPath/showItemInFolder, sig: "openPath(path), showItemInFolder(path)", upstream: "gpui open_with_system/reveal_path", impl: implemented, test: tested, evidence: "missing path → unavailable"}
      - {name: trashItem, sig: "trashItem(path) — NSFileManager trashItemAtURL (sync)", impl: implemented, test: untested, platform: darwin}
      - {name: beep, sig: "beep() — NSBeep", impl: implemented, test: untested, platform: darwin}
    status: {impl: implemented, test: tested, platform: darwin, notes: "restricted schemes enforced: no file://, no javascript: (→denied)"}

  deepLink:
    methods:
      - {name: onUrl, sig: "openUrls event {urls[]} — app.on_open_urls registered at init", impl: implemented, test: untested}
      - {name: registerSchemes, sig: "deepLink.register(scheme) — gpui register_url_scheme", impl: implemented, test: tested, evidence: "platform.jsonl → unavailable unbundled", notes: "runtime registration works only in bundled .app; declare schemes in Info.plist at package time"}
    status: {impl: implemented, test: tested, platform: darwin, notes: "pairs with singleInstance for running-app delivery; OAuth via loopback+deeplink"}

  protocol:
    methods:
      - {name: registerInternal, sig: "app:// resource resolution → packaged assets, MIME by ext, scoped paths, traversal-proof", impl: specified, test: untested}
      - {name: external registration, impl: specified, test: untested, notes: "distinct from internal resources; no transparent custom-scheme fetch promised"}
    status: {impl: specified, test: untested}

  singleInstance:
    methods:
      - {name: requestSingleInstanceLock, sig: "→ {acquired} — app.requestSingleInstanceLock; second launch posts NSDistributedNotification → primary emits secondInstance {argv,cwd}", upstream: "quickgui single-instance.ts", impl: implemented, test: untested, platform: darwin}
